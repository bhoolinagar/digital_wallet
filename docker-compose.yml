version: "3.8"
services:
  mysql:
    image: mysql:8.0.40
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: myBatuaa
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: java-app
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: secret
    depends_on:
      - mysql

volumes:
  mysql-data: